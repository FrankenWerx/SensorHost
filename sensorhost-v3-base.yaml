substitutions:
  name: "sensorhost"
  friendly_name: "SensorHost"
  # Pin substitutions (i2c_sda_pin, i2c_scl_pin, ld2410_tx_pin, ld2410_rx_pin,
  # light_sensor_pin, neopixel_pin) are defined per chip in each variant file:
  # the XIAO C3 and C6 route different GPIOs to the same D-pads on the PCB.

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: "FrankenWerx.sensorhost"
    version: "1.0.0"

logger:

api:

ota:
  - platform: esphome

wifi:
  fast_connect: false
  power_save_mode: NONE
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret ap_fallback_password

captive_portal:

esp32_improv:
  authorizer: none

i2c:
  - id: "AHT20"
    sda: ${i2c_sda_pin}
    scl: ${i2c_scl_pin}
    scan: true
    frequency: 50kHz

uart:
  id: ld2410_uart
  tx_pin: ${ld2410_tx_pin}
  rx_pin: ${ld2410_rx_pin}
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart
  id: ld2410_comp

select:
  - platform: ld2410
    distance_resolution:
      name: distance resolution
    baud_rate:
      name: baud rate
    light_function:
      name: light function
    out_pin_level:
      name: out pin level

button:
  - platform: ld2410
    factory_reset:
      name: "factory reset"
    restart:
      name: "restart"
    query_params:
      name: query params

number:
  - platform: ld2410
    timeout:
      name: timeout
    max_move_distance_gate:
      name: max move distance gate
    max_still_distance_gate:
      name: max still distance gate
    g0:
      move_threshold:
        name: g0 move threshold
      still_threshold:
        name: g0 still threshold
    g1:
      move_threshold:
        name: g1 move threshold
      still_threshold:
        name: g1 still threshold
    g2:
      move_threshold:
        name: g2 move threshold
      still_threshold:
        name: g2 still threshold
    g3:
      move_threshold:
        name: g3 move threshold
      still_threshold:
        name: g3 still threshold
    g4:
      move_threshold:
        name: g4 move threshold
      still_threshold:
        name: g4 still threshold
    g5:
      move_threshold:
        name: g5 move threshold
      still_threshold:
        name: g5 still threshold
    g6:
      move_threshold:
        name: g6 move threshold
      still_threshold:
        name: g6 still threshold
    g7:
      move_threshold:
        name: g7 move threshold
      still_threshold:
        name: g7 still threshold
    g8:
      move_threshold:
        name: g8 move threshold
      still_threshold:
        name: g8 still threshold
    light_threshold:
      name: light threshold

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence Detected"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

text_sensor:
  - platform: ld2410
    version:
      name: "Presence Sensor Version"
    mac_address:
      name: "Presence Sensor MAC Address"

switch:
  - platform: ld2410
    engineering_mode:
      name: "engineering mode"
    bluetooth:
      name: control Bluetooth

sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    id: die_temp

  - platform: ld2410
    moving_distance:
      name: "Moving distance (cm)"
    still_distance:
      name: "Still Distance (cm)"
    moving_energy:
      name: "Move Energy (%)"
    still_energy:
      name: "Still Energy (%)"
    detection_distance:
      name: "Distance Detection (cm)"
    g0:
      move_energy:
        name: g0 move energy
      still_energy:
        name: g0 still energy
    g1:
      move_energy:
        name: g1 move energy
      still_energy:
        name: g1 still energy
    g2:
      move_energy:
        name: g2 move energy
      still_energy:
        name: g2 still energy
    g3:
      move_energy:
        name: g3 move energy
      still_energy:
        name: g3 still energy
    g4:
      move_energy:
        name: g4 move energy
      still_energy:
        name: g4 still energy
    g5:
      move_energy:
        name: g5 move energy
      still_energy:
        name: g5 still energy
    g6:
      move_energy:
        name: g6 move energy
      still_energy:
        name: g6 still energy
    g7:
      move_energy:
        name: g7 move energy
      still_energy:
        name: g7 still energy
    g8:
      move_energy:
        name: g8 move energy
      still_energy:
        name: g8 still energy
    light:
      name: light

  - platform: aht10
    variant: AHT20
    temperature:
      name: "Temperature"
      filters:
        - lambda: |-
            float offset_f = 18.5;
            return x * (9.0/5.0) + 32.0 - offset_f;
      unit_of_measurement: "°F"
    humidity:
      name: "Humidity"
      icon: "mdi:water-percent"
    update_interval: 90s

  - platform: bmp280_i2c
    address: 0x77
    update_interval: 90s
    pressure:
      name: "Barometric Pressure"

  - platform: adc
    pin: ${light_sensor_pin}
    name: "Light Sensor"
    unit_of_measurement: "lx"
    attenuation: 12db
    filters:
      - lambda: return x * 2000.0;
    update_interval: 5s

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: ${neopixel_pin}
    num_leds: 1
    name: "NeoPixel Status LED"
